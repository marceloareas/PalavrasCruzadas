# Ajustes de PRODUCAO aplicados por cima do docker-compose.yml.
#
#   cp .env.prod.example .env.prod      # e troque as senhas
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Diferencas em relacao ao desenvolvimento:
#   - bancos e API NAO ficam expostos no host (so o nginx, na WEB_PORT);
#   - senhas e segredo da sessao vem do .env.prod (obrigatorios);
#   - MongoDB com usuario e senha;
#   - containers reiniciam sozinhos; sem cruzadas de exemplo por padrao.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
    ports: !reset []
    restart: unless-stopped

  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina MONGO_USER no .env.prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env.prod}
    ports: !reset []
    restart: unless-stopped

  api:
    environment:
      NODE_ENV: production
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env.prod}
      SEED_EXEMPLOS: ${SEED_EXEMPLOS:-false}
    ports: !reset []
    restart: unless-stopped

  web:
    ports: !override
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped
