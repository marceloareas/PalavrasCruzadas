services:
  db:
    image: postgres:16-alpine
    container_name: pc_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palavras_cruzadas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts em /docker-entrypoint-initdb.d rodam automaticamente na 1a subida.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palavras_cruzadas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pc_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: palavras_cruzadas
      PORT: 3000
      SESSION_SECRET: troque-em-producao
    ports:
      - "3000:3000"

volumes:
  pgdata:
