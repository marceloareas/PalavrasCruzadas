# Cruzadinha Digital - ambiente completo:
#   web (React, nginx) -> http://localhost:8080
#   api (Node/Express) -> http://localhost:3000/api
#   postgres           -> localhost:5432
#   mongo              -> localhost:27017
services:
  postgres:
    image: postgres:16-alpine
    container_name: cruzadinha_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palavras_cruzadas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Rodam automaticamente so na 1a subida (volume vazio).
      - ./backend/db/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palavras_cruzadas"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: cruzadinha_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: cruzadinha_api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: palavras_cruzadas
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: palavras_cruzadas
      PORT: 3000
      SESSION_SECRET: troque-em-producao
      SEED_EXEMPLOS: "true"
    ports:
      - "3000:3000"

  web:
    build: ./frontend
    container_name: cruzadinha_web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  mongodata:
