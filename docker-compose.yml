# Cruzadinha Digital - ambiente completo:
#   web (React, nginx) -> http://localhost:8080
#   api (Node/Express) -> http://localhost:3000/api (troque com API_PORTA)
#   postgres           -> localhost:5432 (troque com PG_PORTA no .env da raiz,
#                         ex.: PG_PORTA=5433 se a 5432 ja estiver em uso)
#   mongo              -> localhost:27017
#   ludica-mock        -> http://localhost:4000/pontuacao (finge ser o Ludica)
services:
  postgres:
    image: postgres:16-alpine
    container_name: cruzadinha_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palavras_cruzadas
    ports:
      - "${PG_PORTA:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Rodam automaticamente so na 1a subida (volume vazio).
      - ./backend/db/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palavras_cruzadas"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: cruzadinha_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: cruzadinha_api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: palavras_cruzadas
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: palavras_cruzadas
      PORT: 3000
      SESSION_SECRET: troque-em-producao
      SEED_EXEMPLOS: "true"
      # Integracao com o Ludica (ver docs/integracao-ludica.md). Por padrao
      # fala com o ludica-mock; para usar um Ludica de verdade rodando na
      # maquina, defina no .env da raiz:
      #   LUDICA_URL_PONTUACAO=http://host.docker.internal:3000/cruzadinha/pontuacao
      #   LUDICA_URL_SITE=http://localhost:5173
      LOGIN_DEV: "true"                 # atalhos "entrar como" / gerar link
      LUDICA_SEGREDO: ${LUDICA_SEGREDO:-jabuticaba}   # palavra de teste
      LUDICA_URL_PONTUACAO: ${LUDICA_URL_PONTUACAO:-http://ludica-mock:4000/pontuacao}
      LUDICA_URL_SITE: ${LUDICA_URL_SITE:-}
    ports:
      - "${API_PORTA:-3000}:3000"

  # Faz o papel da API de pontuacao do Ludica em desenvolvimento.
  ludica-mock:
    build: ./backend
    container_name: cruzadinha_ludica_mock
    command: ["node", "scripts/ludica-mock.js"]
    environment:
      LUDICA_SEGREDO: ${LUDICA_SEGREDO:-jabuticaba}
    ports:
      - "4000:4000"

  web:
    build: ./frontend
    container_name: cruzadinha_web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  mongodata:
